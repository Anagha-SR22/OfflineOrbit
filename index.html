  <style>
    :root { --blue:#2450d8; --bg:#f5f6fa; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --green:#16a34a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .app-header { display:flex; align-items:center; gap:28px; flex-wrap:wrap; padding:14px 24px; background:var(--blue); color:white; }
    .app-title { margin:0; font-size:24px; }
    .app-nav { margin-left:auto; display:flex; gap:28px; }
    .app-nav a { color:white; text-decoration:none; font-weight:700; font-size:18px; }
    .app-controls { display:flex; align-items:center; gap:14px; }
    .lang-toggle button { border:1px solid rgba(255,255,255,.55); background:transparent; color:white; padding:8px 13px; border-radius:9px; cursor:pointer; font-weight:700; }
    .lang-toggle button.active { background:white; color:var(--blue); }
    .status-badge { display:inline-block; padding:7px 13px; border-radius:999px; font-weight:700; }
    .status-online { background:#16a34a; color:white; }
    .status-offline { background:#dc2626; color:white; }
    .view-container { max-width:900px; margin:0 auto; padding:42px 24px; }
    .syllabus h2 { margin-top:0; font-size:28px; }
    .unit { margin-top:28px; }
    .unit h3 { font-size:21px; }
    .lesson-list { list-style:none; padding:0; }
    .lesson-item { background:white; border:1px solid var(--border); border-radius:10px; padding:15px 18px; margin:10px 0; box-shadow:0 2px 5px rgba(0,0,0,.04); }
    .lesson-item.completed { border-color:var(--green); }
    .lesson-item a { color:var(--text); text-decoration:none; font-weight:700; }
    .loading { color:var(--muted); font-size:18px; }
    .error { color:#dc2626; font-weight:700; }
    .error-box,.card,.lesson-page { background:white; border-radius:12px; padding:24px; border:1px solid var(--border); }
    .error-detail { color:var(--muted); line-height:1.6; }
    code { background:#eef0f4; padding:2px 5px; border-radius:4px; }
    @media (max-width:700px) { .app-nav { margin-left:0; } .app-title { width:100%; } }

    /* Part B — lesson content & quiz */
    .lesson-page h2 { margin-top:0; }
    .lesson-page h3 { color:var(--blue); margin-bottom:6px; }
    .lesson-page table { border-collapse:collapse; margin:14px 0; width:100%; }
    .lesson-page table th, .lesson-page table td { border:1px solid var(--border); padding:8px 10px; text-align:left; }
    .lesson-page table th { background:#eef1fb; }
    .example-box { background:#f0f5ff; border-left:4px solid var(--blue); padding:12px 16px; margin:16px 0; border-radius:6px; }
    .quiz { background:white; border:1px solid var(--border); border-radius:12px; padding:20px; margin-top:26px; }
    .quiz-question p { font-weight:700; font-size:17px; }
    .quiz-options { list-style:none; padding:0; margin:14px 0; }
    .quiz-options li { margin:8px 0; }
    .quiz-option { width:100%; text-align:left; padding:11px 15px; border:1px solid var(--border); border-radius:8px; background:#fafbfc; cursor:pointer; font-size:15px; font-family:inherit; }
    .quiz-option:hover:not(:disabled) { border-color:var(--blue); background:#f0f5ff; }
    .quiz-option:disabled { cursor:not-allowed; opacity:.85; }
    .quiz-option--wrong { border-color:#dc2626; background:#fef2f2; text-decoration:line-through; color:#7f1d1d; }
    .quiz-option--correct { border-color:var(--green); background:#f0fdf4; color:#14532d; font-weight:700; }
    .quiz-feedback { margin-top:12px; padding:10px 14px; border-radius:8px; font-weight:600; min-height:20px; }
    .quiz-feedback--wrong { background:#fef2f2; color:#991b1b; }
    .quiz-feedback--correct { background:#f0fdf4; color:#14532d; }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(() => console.log('Service Worker registered'))
          .catch((error) => console.error('Service Worker registration failed:', error));
      });
    }
  </script>
